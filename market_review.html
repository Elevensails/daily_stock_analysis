003ctd>两市成交额\u003c/td>\u003ctd>14896 亿\u003c/td>\u003ctd>中等活跃\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>二、指数结构\u003c/h3>\n\u003cp>上证50下跌0.74%，沪深300下跌0.24%，显示大盘蓝筹股是今日指数下行的主要压力来源。创业板指虽然也收跌，但跌幅较小，且成分股内部分化极剧——权重较大的半导体个股大幅拖累指数，而部分消费医疗股上涨形成对冲。上证指数在3790点附近获得一定支撑，但若明日不能站稳3800点，则可能进入短期震荡区间。整体来看，指数结构未形成共振，属于“权重压盘、小票自救”的格局。\u003c/p>\n\u003cdiv style=\"overflow-x:auto\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>指数\u003c/th>\u003cth>最新\u003c/th>\u003cth>涨跌幅\u003c/th>\u003cth>开盘\u003c/th>\u003cth>最高\u003c/th>\u003cth>最低\u003c/th>\u003cth>振幅\u003c/th>\u003cth>成交额(亿)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>上证指数\u003c/td>\u003ctd>3793.18\u003c/td>\u003ctd>🔴 -0.53%\u003c/td>\u003ctd>3823.29\u003c/td>\u003ctd>3823.60\u003c/td>\u003ctd>3782.48\u003c/td>\u003ctd>N/A\u003c/td>\u003ctd>6889\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>深证成指\u003c/td>\u003ctd>13452.05\u003c/td>\u003ctd>🔴 -0.43%\u003c/td>\u003ctd>13498.75\u003c/td>\u003ctd>13598.39\u003c/td>\u003ctd>13267.64\u003c/td>\u003ctd>N/A\u003c/td>\u003ctd>7905\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>创业板指\u003c/td>\u003ctd>3311.32\u003c/td>\u003ctd>🔴 -0.47%\u003c/td>\u003ctd>3333.48\u003c/td>\u003ctd>3363.09\u003c/td>\u003ctd>3249.65\u003c/td>\u003ctd>N/A\u003c/td>\u003ctd>3711\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>上证50\u003c/td>\u003ctd>2901.53\u003c/td>\u003ctd>🔴 -0.74%\u003c/td>\u003ctd>2948.71\u003c/td>\u003ctd>2948.71\u003c/td>\u003ctd>2885.19\u003c/td>\u003ctd>N/A\u003c/td>\u003ctd>1407\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>沪深300\u003c/td>\u003ctd>4558.37\u003c/td>\u003ctd>🔴 -0.24%\u003c/td>\u003ctd>4582.09\u003c/td>\u003ctd>4586.12\u003c/td>\u003ctd>4516.32\u003c/td>\u003ctd>N/A\u003c/td>\u003ctd>4847\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>三、板块主线\u003c/h3>\n\u003cli>**行业领涨**：教育运营及其他（+6.78%）、乳品（+6.76%）、饮料乳品（+6.52%）——表面上是教育板块异动，但乳品和饮料乳品板块的放量上涨更具代表性，与概念题材中的乳业、代糖、调味品形成联动，可视为“消费防御”主线。\u003c/li>\n\u003cli>**行业领跌**：半导体设备（-7.91%）、半导体材料（-7.16%）、集成
